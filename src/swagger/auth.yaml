paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Inscription d'un nouvel utilisateur
      description: >-
        Crée un compte immédiatement utilisable et connecte l'utilisateur
        (accessToken + refreshToken retournés). La vérification par code OTP a
        été retirée. Seuls email, password et firstName sont requis.
      requestBody:
        required: true
        content:
          application/json:
              type: object
              required:
                - email
                - password
                - firstName
              properties:
                email:
                  type: string
                  format: email
                  example: marie@example.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123
                  description: Au moins 8 caractères
                firstName:
                  type: string
                  example: Marie
                lastName:
                  type: string
                  example: Dupont
                  description: Optionnel
                phone:
                  type: string
                  example: "+237690000000"
                  description: Optionnel, normalisé automatiquement
                country:
                  type: string
                  example: Cameroun
                  default: Cameroun
                  description: Pays de résidence
                gender:
                  type: string
                  enum: [male, female, other, prefer_not_to_say]
                  description: Genre (optionnel)
                referralCode:
                  type: string
                  description: Code de parrainage (optionnel)
      responses:
        '201':
          description: Inscription réussie, utilisateur connecté
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      referralAccepted:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Connexion utilisateur
      description: Connecte l'utilisateur et retourne les tokens JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      provider:
                        $ref: '#/components/schemas/Provider'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '401':
          description: Identifiants incorrects
        '423':
          description: Compte verrouillé

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Rafraîchir l'access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          description: Refresh token invalide ou expiré

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Déconnexion
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Déconnexion réussie

  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Déconnexion de tous les appareils
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Déconnexion de tous les appareils réussie

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Mot de passe oublié
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Email de réinitialisation envoyé si le compte existe

  /auth/reset-password/{token}:
    post:
      tags:
        - Auth
      summary: Réinitialiser le mot de passe
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Mot de passe réinitialisé
        '400':
          description: Token invalide ou expiré

  /auth/me:
    get:
      tags:
        - Auth
      summary: Obtenir le profil connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      provider:
                        $ref: '#/components/schemas/Provider'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
